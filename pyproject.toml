[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversecore"
version = "0.1.0"
description = "A local-first static inspection toolkit for authorized software analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "REVERSECORE contributors" }]
dependencies = []

[project.scripts]
reversecore = "reversecore.cli:main"

[tool.setuptools.packages.find]
include = ["reversecore*"]
